<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Арена: Рикошет</title><link rel="stylesheet" href="/style.css"><script defer src="/bridge.js"></script><script defer src="/game.js"></script></head>
